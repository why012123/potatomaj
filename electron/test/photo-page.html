<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>potatomaj 端到端识图测试台</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  /* 把截图铺满整个视口 —— capturePage 抓到的就是这张图，
     等价于「雀魂窗口里正好摆着这一局」 */
  img { display: block; width: 100vw; height: 100vh; object-fit: fill; }
</style>
</head>
<body>
  <img id="shot" alt="">
<script>
  // ?img=file:///…/samples/sanma5.webp   要显示哪张截图
  // ?auto=1                              加载完自动跑一遍「截图 -> 识图 -> 收益」
  const q = new URLSearchParams(location.search);
  const img = document.getElementById('shot');
  const out = (m) => console.log('[test] ' + m);

  img.addEventListener('load', async () => {
    if (q.get('auto') !== '1') return;
    await new Promise((r) => setTimeout(r, 1600));  // 等画面真的画上去
    try {
      const full = await window.__potatomaj.capture('full');
      out('整屏识别: 手牌 ' + (full.hand || []).join(' ') + '  宝牌 ' + (full.dora || []).join(' '));
      out('等效张数 ' + full.handEffective + '  建议 ' + (full.advice && full.advice.best)
        + '  模式 ' + (full.advice && full.advice.mode));
      out('牌子 ' + (full.badges || []).length + ' 个: '
        + (full.badges || []).map((b) => b.tile + '=' + (b.score === null ? b.ukeire + '枚' : b.score + '%')
          + (b.best ? '(金)' : '')).join('  '));
      out('BEFORE ' + JSON.stringify(full.badges));

      // 等气泡真的画到页面上 —— 下面要验证的正是「它们不会被拍进截图」
      await new Promise((r) => setTimeout(r, 900));
      const drawn = window.__potatomaj.tips();
      out('页面上此刻有 ' + drawn.length + ' 个气泡（识别时它们必须落在取景框外）');

      // 再走一遍「只截手牌那一条」的路 —— 这条路才是每巡真正用的
      const strip = await window.__potatomaj.capture('hand');
      out('裁条识别: 手牌 ' + (strip.hand || []).join(' '));
      const same = JSON.stringify(full.hand) === JSON.stringify(strip.hand);
      out('裁条和整屏结果一致: ' + (same ? '是' : '否'));
      out('气泡没被拍进去（带气泡照样认对）: '
        + (same && drawn.length > 0 ? '是' : (drawn.length === 0 ? '没气泡可比' : '否')));
      // 裁条拿到的位置要换算回整页坐标，否则牌子会全部挤到左上角
      const b0 = (full.badges || [])[0];
      const s0 = (strip.badges || [])[0];
      if (b0 && s0) {
        const d = Math.abs(b0.box[0] - s0.box[0]) + Math.abs(b0.box[1] - s0.box[1]);
        out('裁条后位置偏差 ' + d.toFixed(4) + '（应该接近 0）');
      }
      // 直接查像素：把带气泡的手牌条截下来，数顶部几行有没有气泡色
      // （气泡是蓝/金/红高饱和，牌面是米白 —— 饱和度高就说明气泡被拍进去了）
      if (window.__potatomaj.probeStrip) {
        // **必须做对照**：把气泡藏起来再量一次。
        // 只量一次说明不了问题 —— 游戏画面本身在那个位置就可能有彩色 UI，
        // 那样量出来的高饱和像素跟我们的气泡毫无关系。
        // 两次之差才是「气泡贡献了多少」。
        const withTips = await window.__potatomaj.probeStrip();
        const layer = document.getElementById('__pm_tips');
        const prev = layer ? layer.style.display : null;
        if (layer) layer.style.display = 'none';
        await new Promise((r) => setTimeout(r, 250));
        const without = await window.__potatomaj.probeStrip();
        if (layer) layer.style.display = prev || '';
        if (withTips && without) {
          const delta = withTips.ratio - without.ratio;
          out('取景框顶部高饱和像素：带气泡 ' + (withTips.ratio * 100).toFixed(2)
            + '%  藏起气泡 ' + (without.ratio * 100).toFixed(2)
            + '%  差 ' + (delta * 100).toFixed(2) + ' 个百分点');
          out('判定: ' + (delta < 0.005
            ? '✅ 气泡确实在取景框外（两次几乎一样）'
            : '❌ 气泡被拍进去了，贡献了 ' + (delta * 100).toFixed(2) + ' 个百分点'));
        } else {
          out('取景框顶部检查: 拿不到（没有取景框）');
        }
      }
      out('AFTER ' + JSON.stringify(strip.badges));
      out('页面上的牌子: ' + JSON.stringify(window.__potatomaj.tips()));
    } catch (e) {
      out('出错: ' + (e && e.message));
    }
    out('DONE');
  });

  img.addEventListener('error', () => out('图片加载失败: ' + img.src));
  img.src = q.get('img') || '';
</script>
</body>
</html>
