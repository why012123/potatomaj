<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>土豆麻将 · 状态</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font: 11px/1.6 -apple-system, "PingFang SC", sans-serif;
    color: #d8e4f0;
    /* 实底而非透明：透明 + 置顶窗口压在 WebGL 上，内容一变就要重新合成，
       表现为闪烁。实底窗口没这个问题。 */
    background: #1b2029;
    user-select: none;
    -webkit-app-region: drag;          /* 整块可拖动 */
  }
  .panel {
    margin: 0; padding: 9px 11px; height: calc(100% - 18px);
    background: #1b2029;
    border: 1px solid rgba(120, 200, 255, .35);
    border-radius: 10px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .title { color: #8fd3ff; font-weight: 600; font-size: 12px; }
  #game .v { max-width: 132px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row { display: flex; justify-content: space-between; }
  .k { color: #93a1b3; }
  .v { color: #eaf2fb; font-variant-numeric: tabular-nums; }
  .ok { color: #7ee08a; }
  .warn { color: #ffb36b; }
  .seat {
    -webkit-app-region: no-drag;
    padding: 1px 6px; cursor: pointer; font-size: 11px;
    background: rgba(255,255,255,.10); color: #cfd9e6;
    border: 1px solid rgba(255,255,255,.25); border-radius: 4px;
  }
  .seat.on { background: #3d8bfd; color: #fff; border-color: #3d8bfd; }
  button {
    -webkit-app-region: no-drag;
    margin-top: 4px; padding: 4px 8px; cursor: pointer;
    background: rgba(255,255,255,.12); color: #dfe7f1;
    border: 1px solid rgba(255,255,255,.28); border-radius: 5px;
    font-size: 11px;
  }
  button:hover { background: rgba(255,255,255,.22); }
</style>
</head>
<body>
  <div class="panel">
    <div class="title">🀄 土豆麻将 · 抓包</div>
    <div class="row"><span class="k">连接</span><span class="v" id="sockets">0</span></div>
    <div class="row"><span class="k">收 / 发</span><span class="v" id="frames">0 / 0</span></div>
    <div class="row"><span class="k">落盘</span><span class="v" id="dump">—</span></div>
    <div id="game" style="margin-top:4px;padding-top:4px;border-top:1px solid rgba(255,255,255,.15)">
      <div class="row"><span class="k">手牌</span><span class="v" id="hand">—</span></div>
      <div class="row"><span class="k">宝牌</span><span class="v" id="dora">—</span></div>
      <div class="row"><span class="k">牌河</span><span class="v" id="ponds">—</span></div>
      <div id="advice" style="margin-top:3px;color:#ffd479;font-weight:600;font-size:12px">—</div>
      <div style="margin-top:4px;display:flex;gap:3px;align-items:center">
        <span class="k" style="font-size:10px">我是</span>
        <button class="seat" data-seat="0">东</button>
        <button class="seat" data-seat="1">南</button>
        <button class="seat" data-seat="2">西</button>
        <button class="seat" data-seat="3">北</button>
      </div>
    </div>
    <div id="feed" style="margin-top:3px;height:34px;overflow:hidden;font-size:10px;
         color:#9fd6b0;line-height:1.35;font-family:ui-monospace,Menlo,monospace"></div>
    <button id="open">打开帧目录</button>
  </div>
<script>
  // 这里没有 require（页面脚本），所有 IPC 都走 preload 暴露的接口/事件
  const $ = (id) => document.getElementById(id);

  // 只在值真的变了才写 DOM —— 透明窗口的每次重排都会触发一次重绘，
  // 写同样的内容也会闪
  const cache = {};
  function setText(id, text) {
    if (cache[id] === text) return;
    cache[id] = text;
    $(id).textContent = text;
  }
  // 「进张」那行可能很长，窗口只有 268px 宽，截断显示（完整内容在 gamestate.json 里）
  function clip(text, n) {
    return text.length > n ? text.slice(0, n - 1) + '…' : text;
  }

  window.addEventListener('pm-stats', (e) => {
    const s = e.detail || {};
    setText('sockets', String(s.sockets || 0));
    setText('frames', `${s.received || 0} / ${s.sent || 0}`);
    const d = $('dump');
    if (s.dump) { d.textContent = '开'; d.className = 'v ok'; }
    else { d.textContent = '关（加 --dump）'; d.className = 'v warn'; }
    const feed = (s.lastMessages || []).slice(-4)
      .map((m) => `<div>${String(m).replace(/</g, '&lt;')}</div>`).join('');
    if (cache.feed !== feed) { cache.feed = feed; $('feed').innerHTML = feed; }
  });

  window.addEventListener('pm-gamestate', (e) => {
    const g = e.detail || {};
    const names = ['东', '南', '西', '北'];
    setText('hand', (g.hand && g.hand.length) ? g.hand.join(' ') : '—');
    $('hand').title = (g.hand || []).join(' ');
    setText('dora', (g.dora && g.dora.length) ? g.dora.join(' ') : '—');
    setText('ponds', (g.discards || []).map((a, i) => names[i] + (a || []).length).join(' '));
    setText('advice', (g.advice && g.advice.text) ? clip(g.advice.text, 34) : '—');
  });

  document.getElementById('open').addEventListener('click', () => {
    if (window.potatomaj) window.potatomaj.openDumpDir();
  });

  document.querySelectorAll('.seat').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (window.potatomaj) window.potatomaj.setSeat(Number(btn.dataset.seat));
    });
  });

  window.addEventListener('pm-gamestate', (e) => {
    const seat = (e.detail || {}).mySeat;
    document.querySelectorAll('.seat').forEach((b) => {
      b.classList.toggle('on', Number(b.dataset.seat) === seat);
    });
  });
</script>
</body>
</html>
