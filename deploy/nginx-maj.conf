# ============================================================
# 土豆麻将 · 网页对战平台 —— nginx 反代（香港 VPS）
#
# 装在 VPS 上：/etc/nginx/sites-available/maj
# 然后 ln -s 到 sites-enabled/ 并 nginx -t && systemctl reload nginx
#
# 链路：
#   浏览器 --443(TLS)--> 这台 nginx --127.0.0.1:8080--> frps
#        --frp 隧道--> 本机 frpc --> 127.0.0.1:8790（python run.py）
#
# 三条关键点（少一条都会坏）：
#   1. **WebSocket 必须能升级**：Upgrade / Connection 头要透传，而且
#      proxy_read_timeout 要放大 —— 牌桌上「轮到你了」可能等 30 秒以上，
#      默认 60s 会在关键时刻把连接掐掉。
#   2. **Host 头必须原样透传**：frps 是按 customDomains 路由的，
#      改掉 Host 就找不到对应的隧道。
#   3. **不能用代理缓冲**：牌桌是持续小包推送，缓冲会攒着一起发，
#      看起来就像「卡住了」。
# ============================================================

upstream maj_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ---------------- maj.xjtuwhy.com ----------------
server {
    listen 80;
    server_name maj.xjtuwhy.com;
    # certbot 的 http-01 校验走这里
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name maj.xjtuwhy.com;

    ssl_certificate /etc/letsencrypt/live/maj.xjtuwhy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maj.xjtuwhy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 牌桌的一个快照就有几十 KB，默认 1m 够用，但留点余量
    client_max_body_size 4m;

    access_log /var/log/nginx/maj.access.log;
    error_log  /var/log/nginx/maj.error.log warn;

    # ---- WebSocket（必须单独一段：这些头不能给普通 HTTP 请求）----
    location /ws {
        proxy_pass http://maj_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接：牌局里可能安静好几十秒（等玩家思考），超时太短会断线
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
        proxy_connect_timeout 15s;
        # 不缓冲：牌桌是持续小包推送
        proxy_buffering off;
    }

    # ---- 牌面图：可以让浏览器长期缓存 ----
    location /tiles/ {
        proxy_pass http://maj_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ---- 前端静态资源（带内容哈希，可以长期缓存）----
    location /app/ {
        proxy_pass http://maj_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 7d;
    }

    location / {
        proxy_pass http://maj_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # keep-alive 到上游：清掉 hop-by-hop 的 Connection
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ---- 运维接口：别让公网随便看（带匿名 ID 的画像表尤其别裸奔）----
    # 用 htpasswd 生成：printf "maj:$(openssl passwd -apr1 你的密码)\n" > /etc/nginx/.maj_htpasswd
    location ~ ^/api/(profiles|record)$ {
        auth_basic "restricted";
        auth_basic_user_file /etc/nginx/.maj_htpasswd;
        proxy_pass http://maj_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ---- 健康检查留着公开，方便外部探活 ----
    location = /api/health {
        proxy_pass http://maj_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
