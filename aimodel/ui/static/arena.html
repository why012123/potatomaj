<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>土豆麻将 · ELO 混战池</title>
<style>
  :root{--bg:#0e1512;--card:#16211c;--line:#25352d;--fg:#e8efe9;--dim:#8ba396;
        --gold:#e8c15a;--red:#e05a5a;--blue:#5aa9e0;--green:#5ad48a;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 -apple-system,"PingFang SC","Helvetica Neue",sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;
         border-bottom:1px solid var(--line);background:#121b17;position:sticky;top:0;z-index:9}
  h1{font-size:17px;margin:0;color:var(--gold);white-space:nowrap}
  .spacer{flex:1}
  button{background:#1d2a24;color:var(--fg);border:1px solid var(--line);border-radius:7px;
         padding:7px 14px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--gold);color:var(--gold)}
  button.primary{background:var(--gold);color:#1a1a1a;border-color:var(--gold);font-weight:600}
  button.danger:hover{border-color:var(--red);color:var(--red)}
  input[type=number]{width:76px;background:#101a16;color:var(--fg);border:1px solid var(--line);
                     border-radius:6px;padding:6px 8px;font-size:13px}
  label{color:var(--dim);font-size:12px;display:inline-flex;align-items:center;gap:6px}
  main{padding:14px 18px 40px;max-width:1900px;margin:0 auto}
  .stats{display:flex;gap:22px;flex-wrap:wrap;color:var(--dim);font-size:12px;
         padding:10px 14px;background:var(--card);border:1px solid var(--line);
         border-radius:10px;margin-bottom:14px}
  .stats b{color:var(--fg);font-weight:600}
  .err{background:#2a1616;border:1px solid #5a2a2a;color:#ffb3b3;padding:9px 13px;
       border-radius:8px;margin-bottom:12px;font-size:13px}
  /* 两栏各占一半；窄屏再退回单栏 */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  @media(max-width:1180px){.grid{grid-template-columns:1fr}}
  .card table{display:block;overflow-x:auto}
  /* 右栏里的长表内部滚动，别把整页撑长、也别让两栏高度差太大 */
  .scroll{max-height:74vh;overflow:auto}
  .scroll table{display:table;width:100%}
  .card h2{position:sticky;top:0;background:var(--card);z-index:2}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .card h2{font-size:13px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);
           color:var(--dim);font-weight:500;letter-spacing:.04em}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--dim);font-weight:500;font-size:11px;text-align:left;padding:7px 8px;
     border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:6px 8px;border-bottom:1px solid #1d2a24;white-space:nowrap}
  tr.out{opacity:.42}
  tr:hover td{background:#1a2620}
  .rank{color:var(--dim);width:28px}
  .name{font-weight:600}
  .ver{font-size:11px;color:var(--dim)}
  .tag{font-size:11px;padding:1px 6px;border-radius:5px;background:#1d2a24;border:1px solid var(--line)}
  .elo{font-weight:700;font-variant-numeric:tabular-nums}
  .bar{position:relative;height:15px;background:#101a16;border-radius:4px;min-width:78px;
       border:1px solid #1d2a24}
  .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;display:block}
  .bar span{position:absolute;right:5px;top:-1px;font-size:11px;color:var(--fg);
            font-variant-numeric:tabular-nums}
  .b-elo i{background:linear-gradient(90deg,#8a6c1f,var(--gold))}
  .b-first i{background:linear-gradient(90deg,#1f5a3a,var(--green))}
  .b-agari i{background:linear-gradient(90deg,#1f4a6a,var(--blue))}
  #log{height:290px;overflow:auto;font:11px/1.65 ui-monospace,Menlo,monospace;
       color:var(--dim);padding:9px 13px;white-space:pre-wrap}
  #spark{width:100%;height:290px;display:block}
  .legend{display:flex;gap:12px;padding:8px 13px;font-size:11px;color:var(--dim);
          border-top:1px solid var(--line)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
  tbody tr{cursor:pointer}
  #mask{position:fixed;inset:0;background:#0009;display:none;z-index:20;
        align-items:center;justify-content:center;padding:24px}
  #mask.on{display:flex}
  #detail{background:var(--card);border:1px solid var(--line);border-radius:12px;
          max-width:1000px;width:100%;max-height:88vh;overflow:auto;padding:0}
  #detail h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:16px;
             display:flex;align-items:center;gap:10px}
  #detail .body{padding:14px 18px}
  #detail .kv{display:flex;gap:20px;flex-wrap:wrap;color:var(--dim);font-size:12px;margin-bottom:12px}
  #detail .kv b{color:var(--fg);font-size:14px}
  #detail table{font-size:12px}
  #detail canvas{width:100%;height:120px;display:block;margin:6px 0 14px}
  .close{margin-left:auto;cursor:pointer;color:var(--dim);font-size:20px;line-height:1}
  .close:hover{color:var(--gold)}
  .pos{color:var(--green)} .neg{color:var(--red)}
</style>
</head>
<body>
<header>
  <h1>🏟 土豆麻将 · ELO 混战池</h1>
  <label>场次 <input type="number" id="matches" value="200" min="1" step="50"></label>
  <label>每场间隔 <input type="number" id="pace" value="0" min="0" step="0.1" style="width:64px">秒</label>
  <label>种子 <input type="number" id="seed" value="0" min="0" step="1" style="width:76px"></label>
  <button class="primary" id="start">开始</button>
  <button id="pause">暂停</button>
  <button id="reset" class="danger">重置天梯</button>
  <span class="spacer"></span>
  <label>点数除数
    <input type="range" id="div" min="0" max="10" step="1" value="0" style="width:130px">
    <b id="divlabel" style="color:var(--gold);min-width:52px;display:inline-block">500</b>
  </label>
  <label>K <input type="number" id="k" value="30" min="1" step="4" style="width:60px"></label>
  <label>分差上限 <input type="number" id="gap" value="200" min="50" step="50" style="width:70px"></label>
  <label><input type="checkbox" id="strict" checked> 严格分差</label>
</header>

<main>
  <div class="stats" id="stats"></div>
  <div class="err" id="err" style="display:none"></div>
  <div class="grid">
    <div class="card">
      <h2>模型汇总（同一模型的 <span id="copies">3</span> 个参赛者合起来算）· 按均分排序</h2>
      <div class="scroll">
      <table>
        <thead><tr>
          <th>#</th><th>模型</th><th>版本</th><th>风格</th><th>均分</th>
          <th>最好 / 最差</th><th>极差</th><th>场数</th><th>一位率</th><th>和了率</th><th>放铳率</th>
        </tr></thead>
        <tbody id="sumrows"></tbody>
      </table>
      </div>
    </div>
    <div class="card">
      <h2>参赛者排名榜（每个参赛者分开记分）· 按 ELO 排序</h2>
      <div class="scroll">
      <table>
        <thead><tr>
          <th>#</th><th>参战者</th><th>版本</th><th>风格</th><th>ELO</th>
          <th>一位率</th><th>和了率</th><th>场数</th><th>均位</th><th>状态</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      </div>
      <div class="legend">
        <span><i class="dot" style="background:var(--gold)"></i>ELO</span>
        <span><i class="dot" style="background:var(--green)"></i>一位率</span>
        <span><i class="dot" style="background:var(--blue)"></i>和了率</span>
        <span class="spacer"></span>
        <span>低于 0 分保底为 0（不出局）</span>
      </div>
    </div>
    <div class="card">
      <h2>ELO 走势（前 6 名）</h2>
      <canvas id="spark"></canvas>
      <div class="legend" id="sparklegend"></div>
    </div>
    <div class="card">
      <h2>最近对局（🌱 后面是种子，可复现）</h2>
      <div id="log"></div>
    </div>
  </div>
</main>

<div id="mask">
  <div id="detail">
    <h3><span id="d-title">参赛者</span><span class="close" id="d-close">×</span></h3>
    <div class="body">
      <div class="kv" id="d-kv"></div>
      <canvas id="d-chart"></canvas>
      <table>
        <thead><tr><th>场次</th><th>种子</th><th>名次</th><th>点数</th>
          <th>点数分</th><th>名次分</th><th>合计</th><th>之后 ELO</th><th>对手</th></tr></thead>
        <tbody id="d-rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let charts = {};            // key -> color
const COLORS = ["#e8c15a","#5ad48a","#5aa9e0","#e05a5a","#c07ae0","#e09a5a"];
let lastTable = [];

function bar(cls, ratio, text) {
  const pct = Math.max(0, Math.min(1, ratio)) * 100;
  return `<div class="bar ${cls}"><i style="width:${pct.toFixed(1)}%"></i><span>${text}</span></div>`;
}

function render(s) {
  $("stats").innerHTML = `
    <span>模式：<b>${s.players} 麻</b></span>
    <span>状态：<b style="color:${s.running ? 'var(--green)' : 'var(--dim)'}">${s.running ? '进行中' : '已暂停'}</b></span>
    <span>本轮进度：<b>${s.done_run}${s.target ? ' / ' + s.target : ''}</b> 场</span>
    <span>累计：<b>${s.done_total}</b> 场</span>
    <span>保底中：<b>${s.total - s.alive}</b> 个</span>
    <span>参战：<b>${s.total}</b></span>
    <span>K = <b>${s.k}</b></span>
    <span>分差上限：<b>${s.max_gap}</b></span>
    <span>种子基数：<b>${s.seed}</b>（第 n 场 = ${s.seed} + n×7919）</span>
    <span>点数除数：<b>${s.divisor ? s.divisor : "关闭"}</b></span>`;
  syncDiv(s.divisor);
  $("err").style.display = s.error ? "block" : "none";
  $("err").textContent = s.error || "";

  const maxElo = Math.max(560, ...s.table.map(r => r.分数));
  const minElo = Math.min(400, ...s.table.map(r => r.分数));
  $("rows").innerHTML = s.table.map((r, i) => {
    const eloR = (r.分数 - minElo) / Math.max(1, maxElo - minElo);
    return `<tr class="${r.状态 === '淘汰' ? 'out' : ''}">
      <td class="rank">${i + 1}</td>
      <td class="name">${r.名}</td>
      <td class="ver">${r.版本 || '—'}</td>
      <td><span class="tag">${r.风格 || '基线'}</span></td>
      <td>${bar('b-elo', eloR, r.分数.toFixed(0))}</td>
      <td>${bar('b-first', r.一位率, (r.一位率 * 100).toFixed(0) + '%')}</td>
      <td>${bar('b-agari', r.和了率, (r.和了率 * 100).toFixed(0) + '%')}</td>
      <td>${r.场数}<span class="ver"> /${r.局数}局</span></td>
      <td>${r.平均顺位 || '—'}</td>
      <td>${r.状态 === '0分保底' ? '<span style="color:var(--gold)">0分保底</span>' : '<span style="color:var(--green)">存活</span>'}</td>
    </tr>`;
  }).join("");
  // 点行看历史战绩
  [...$("rows").children].forEach((tr, i) => {
    tr.title = "点开看这个参赛者的逐场战绩";
    tr.onclick = () => showDetail(s.table[i].名);
  });

  $("copies").textContent = s.copies || 3;
  $("sumrows").innerHTML = (s.summary || []).map((r, i) => `<tr class="${r.保底 ? 'out' : ''}">
      <td class="rank">${i + 1}</td>
      <td class="name">${r.模型}</td>
      <td class="ver">${r.版本 || '—'}</td>
      <td><span class="tag">${r.风格 || '基线'}</span></td>
      <td class="elo">${r.均分}</td>
      <td>${r.最好} <span class="ver">/ ${r.最差}</span></td>
      <td>${r.极差}</td>
      <td>${r.场数}</td>
      <td>${(r.一位率 * 100).toFixed(0)}%</td>
      <td>${(r.和了率 * 100).toFixed(0)}%</td>
      <td>${(r.放铳率 * 100).toFixed(0)}%</td>
    </tr>`).join("") || '<tr><td colspan="11" class="ver" style="padding:14px">还没开打</td></tr>';
  [...$("sumrows").children].forEach((tr, i) => {
    const row = (s.summary || [])[i];
    if (!row) return;
    tr.title = "点开看 " + row.模型 + " 的 1 号参赛者战绩";
    tr.onclick = () => showDetail(row.模型 + " #1");
  });

  $("log").textContent = (s.log || []).join("\n") || "（还没开打）";
  lastTable = s.table;
  drawSpark(s.table);
}

function drawSpark(rows) {
  const c = $("spark"), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const top = rows.slice(0, 6).filter(r => r.曲线 && r.曲线.length > 1);
  if (!top.length) { g.fillStyle = "#8ba396"; g.font = "12px sans-serif";
                     g.fillText("开打后这里会画出分数走势", 12, 22); return; }
  const all = top.flatMap(r => r.曲线);
  const lo = Math.min(400, ...all), hi = Math.max(600, ...all);
  const Y = v => h - 18 - (v - lo) / (hi - lo) * (h - 30);
  const N = Math.max(...top.map(r => r.曲线.length));
  const X = i => 6 + i / Math.max(1, N - 1) * (w - 12);
  g.strokeStyle = "#25352d"; g.lineWidth = 1;
  [0, 200, 400, 600].forEach(v => {
    if (v < lo || v > hi) return;
    g.beginPath(); g.moveTo(0, Y(v)); g.lineTo(w, Y(v)); g.stroke();
    g.fillStyle = "#63796d"; g.font = "10px sans-serif"; g.fillText(String(v), 3, Y(v) - 3);
  });
  top.forEach((r, k) => {
    g.strokeStyle = COLORS[k % COLORS.length]; g.lineWidth = 1.8; g.beginPath();
    r.曲线.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)));
    g.stroke();
  });
  $("sparklegend").innerHTML = top.map((r, k) =>
    `<span><i class="dot" style="background:${COLORS[k % COLORS.length]}"></i>${r.名}</span>`).join("");
}

async function showDetail(key) {
  let d;
  try { d = await (await fetch("/api/arena/player?key=" + encodeURIComponent(key))).json(); }
  catch (e) { return; }
  if (d.ok === false) { alert(d.error); return; }
  $("d-title").textContent = `${d.label}　${d.版本 ? d.版本 + " · " : ""}${d.风格}`;
  const pct = v => (v * 100).toFixed(0) + "%";
  const sg = v => (v >= 0 ? "pos" : "neg");
  $("d-kv").innerHTML = `
    <span>ELO <b>${d.分数}</b></span>
    <span>场数 <b>${d.场数}</b>（${d.局数} 局）</span>
    <span>一位 <b>${d.一位}</b> · 末位 <b>${d.末位}</b></span>
    <span>一位率 <b>${pct(d.一位率)}</b></span>
    <span>和了率 <b>${pct(d.和了率)}</b></span>
    <span>放铳率 <b>${pct(d.放铳率)}</b></span>
    <span>平均顺位 <b>${d.平均顺位 || "—"}</b></span>
    <span>名次分 <b class="${sg(d.名次分)}">${d.名次分}</b></span>
    <span>点数分 <b class="${sg(d.点数分)}">${d.点数分}</b></span>
    <span>状态 <b>${d.状态}</b></span>`;
  $("d-rows").innerHTML = (d.对局 || []).map(m => `<tr>
      <td>#${m.n}</td><td class="ver">${m.seed}</td>
      <td>${m.rank}位</td><td>${m.score}</td>
      <td class="${sg(m.pts)}">${m.pts >= 0 ? "+" : ""}${m.pts}</td>
      <td class="${sg(m.place)}">${m.place >= 0 ? "+" : ""}${m.place}</td>
      <td class="${sg(m.delta)}"><b>${m.delta >= 0 ? "+" : ""}${m.delta}</b></td>
      <td>${m.rating}</td>
      <td class="ver">${(m.opponents || []).join(" · ")}</td>
    </tr>`).join("") || '<tr><td colspan="9" class="ver">还没打过</td></tr>';
  drawDetailChart(d.曲线 || []);
  $("mask").classList.add("on");
}

function drawDetailChart(vals) {
  const c = $("d-chart"), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth || 800, h = 120;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  if (vals.length < 2) { g.fillStyle = "#8ba396"; g.font = "12px sans-serif";
                         g.fillText("样本还太少，画不出走势", 8, 18); return; }
  const lo = Math.min(400, ...vals), hi = Math.max(600, ...vals);
  const Y = v => h - 16 - (v - lo) / (hi - lo) * (h - 26);
  const X = i => 6 + i / (vals.length - 1) * (w - 12);
  g.strokeStyle = "#25352d";
  [400, 500, 600].forEach(v => { if (v < lo || v > hi) return;
    g.beginPath(); g.moveTo(0, Y(v)); g.lineTo(w, Y(v)); g.stroke();
    g.fillStyle = "#63796d"; g.font = "10px sans-serif"; g.fillText(String(v), 3, Y(v) - 3); });
  g.strokeStyle = "#e8c15a"; g.lineWidth = 2; g.beginPath();
  vals.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)));
  g.stroke();
}

$("d-close").onclick = () => $("mask").classList.remove("on");
$("mask").onclick = e => { if (e.target.id === "mask") $("mask").classList.remove("on"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("mask").classList.remove("on"); });

// 除数滑块：0..9 档 -> 500 / 750 / … / 5000；第 10 档 = 关闭点数项
const DIVS = [500, 750, 1000, 1500, 2000, 2500, 3000, 4000, 5000, 8000, 0];
const divVal = () => DIVS[+$("div").value];
function syncDiv(fromServer) {
  if (fromServer !== undefined) {
    const i = DIVS.indexOf(Math.round(fromServer));
    if (i >= 0) $("div").value = i;
  }
  const v = divVal();
  $("divlabel").textContent = v ? String(v) : "关闭";
  $("divlabel").title = v ? "一局最多 ±" + Math.round(15000 / v) + " 分（三麻）"
                          : "只用名次分，不用点数分";
}
$("div").oninput = () => syncDiv();
$("div").onchange = () => post("/api/arena/settings", {divisor: divVal()});

async function post(path, body) {
  await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"},
                     body: JSON.stringify(body || {})});
  await tick();
}

async function tick() {
  try {
    const s = await (await fetch("/api/arena")).json();
    render(s);
  } catch (e) { /* 服务可能正在重启，下一拍再来 */ }
}

$("start").onclick = () => post("/api/arena/start", {
  matches: +$("matches").value || 100,
  pace: +$("pace").value || 0,
  k: +$("k").value || 24,
  max_gap: +$("gap").value || 200,
  strict: $("strict").checked,
  seed: +$("seed").value || 0,
  divisor: divVal(),
});
$("pause").onclick = () => post("/api/arena/pause");
$("reset").onclick = () => { if (confirm("清空天梯？所有参战者回到 500 分")) post("/api/arena/reset"); };
["k", "gap", "strict", "seed"].forEach(id => $(id).onchange = () => post("/api/arena/settings", {
  k: +$("k").value, max_gap: +$("gap").value, strict: $("strict").checked,
  seed: +$("seed").value || 0,
}));
window.addEventListener("resize", () => drawSpark(lastTable));
tick();
setInterval(tick, 1200);
</script>
</body>
</html>
